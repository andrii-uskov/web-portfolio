<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Крестики-нолики</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="game">
    <h1>Крестики-нолики</h1>

    <p class="description">Игра для двух игроков</p>

    <p id="status" class="status" role="status">
      Ход игрока X
    </p>

    <div class="board" role="group" aria-label="Игровое поле">
      <button class="cell" type="button" aria-label="Клетка 1"></button>
      <button class="cell" type="button" aria-label="Клетка 2"></button>
      <button class="cell" type="button" aria-label="Клетка 3"></button>
      <button class="cell" type="button" aria-label="Клетка 4"></button>
      <button class="cell" type="button" aria-label="Клетка 5"></button>
      <button class="cell" type="button" aria-label="Клетка 6"></button>
      <button class="cell" type="button" aria-label="Клетка 7"></button>
      <button class="cell" type="button" aria-label="Клетка 8"></button>
      <button class="cell" type="button" aria-label="Клетка 9"></button>
    </div>

    <button id="restart" class="restart" type="button">
      Начать заново
    </button>
  </main>
</body>
      </html>
